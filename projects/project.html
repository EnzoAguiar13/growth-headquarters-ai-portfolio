<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B0B0D"><title>Projeto — Enzo Aguiar</title><style>:root{--bg:#0B0B0D;--surface:#1B1B20;--muted:#92929B;--accent:#DC172B;--text:#F4F4F5;--line:#303036}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header,article{max-width:820px;margin:auto;padding:0 24px}header{height:76px;display:flex;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.back{font-weight:750;text-decoration:none}.back:before{content:'← ';color:var(--accent)}article{padding-top:68px;padding-bottom:80px}h1{font-size:clamp(2.6rem,7vw,4.8rem);letter-spacing:-.06em;line-height:.95;margin:0 0 16px}h2{font-size:1.25rem;margin:48px 0 14px}p,li{color:var(--muted);line-height:1.7;font-size:1.02rem}blockquote{border-left:3px solid var(--accent);margin:0;padding:3px 0 3px 18px;color:var(--text)}ul{padding-left:22px}.note{border:1px solid var(--line);background:var(--surface);padding:18px;border-radius:8px;margin-top:45px;font-size:.9rem;color:var(--muted)}</style></head><body><header><a class="back" href="../">Project Showcase</a></header><article id="content" aria-live="polite"><p>Carregando apresentação…</p></article><script>const allowed=['concurso-plus','gh-ai','affiliate-platform','fotograma-ai','qualifica-leads','noir-os','organizador','personal-gateway'];const id=new URLSearchParams(location.search).get('project');const target=allowed.includes(id)?id:null;const root=document.querySelector('#content');if(!target){root.innerHTML='<h1>Projeto não encontrado</h1><p>Escolha uma apresentação na página principal.</p>';throw new Error('invalid project')}fetch(target+'.md').then(r=>{if(!r.ok)throw new Error();return r.text()}).then(md=>{document.title=md.match(/^# (.+)$/m)[1]+' — Enzo Aguiar';let h='';let list=false;for(const line of md.split('\n')){if(line.startsWith('# ')){h+='<h1>'+line.slice(2)+'</h1>'}else if(line.startsWith('## ')){if(list){h+='</ul>';list=false}h+='<h2>'+line.slice(3)+'</h2>'}else if(line.startsWith('> ')){h+='<blockquote>'+line.slice(2)+'</blockquote>'}else if(line.startsWith('- ')){if(!list){h+='<ul>';list=true}h+='<li>'+line.slice(2)+'</li>'}else if(line.trim()&& !line.startsWith('[')){if(list){h+='</ul>';list=false}h+='<p>'+line+'</p>'}}if(list)h+='</ul>';root.innerHTML=h+'<div class="note">Apresentação pública: código, credenciais, dados e configurações internas não são disponibilizados.</div>'}).catch(()=>root.innerHTML='<h1>Indisponível</h1><p>Não foi possível carregar esta apresentação.</p>');</script></body></html>
